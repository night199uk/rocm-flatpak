name: Build ROCm Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 2880
    steps:
      - uses: actions/checkout@v4

      - name: Check build environment
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v lzip >/dev/null || sudo dnf install -y lzip
          bst --version
          git lfs version
          dvc --version
          flatpak --version

      - name: Build runtime and SDK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bst --no-colors --no-interactive \
            --builders 1 --max-jobs 6 \
            build rocm-runtime-flatpak.bst rocm-sdk-flatpak.bst

      - name: Build Flatpak bundles
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf dist runtime-repo sdk-repo
          mkdir -p dist

          bst --no-colors --no-interactive artifact checkout \
            --force --directory runtime-repo rocm-runtime-flatpak.bst
          flatpak build-bundle --runtime --arch=x86_64 \
            runtime-repo dist/rocm-runtime.flatpak \
            org.freedesktop.Platform.GL.ROCm 26.08

          bst --no-colors --no-interactive artifact checkout \
            --force --directory sdk-repo rocm-sdk-flatpak.bst
          flatpak build-bundle --runtime --arch=x86_64 \
            sdk-repo dist/rocm-sdk.flatpak \
            org.freedesktop.Platform.amd.ROCm 26.08

          # GitHub release assets have a 2 GiB per-file limit.
          split -b 1900M -d -a 2 dist/rocm-sdk.flatpak dist/rocm-sdk.flatpak.part-
          rm dist/rocm-sdk.flatpak
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v*) ;;
            *) echo "version must start with v" >&2; exit 1 ;;
          esac

          if gh release view "$VERSION" >/dev/null 2>&1; then
            is_draft=$(gh release view "$VERSION" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "release $VERSION already exists and is not a draft" >&2
              exit 1
            fi
            gh release upload "$VERSION" dist/* --clobber
            gh release edit "$VERSION" --draft --title "$VERSION"
          else
            gh release create "$VERSION" dist/* \
              --draft --title "$VERSION" --generate-notes --target "$TARGET"
          fi
