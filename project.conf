options:
  arch:
    type: arch
    description: The machine architecture
    variable: arch
    values:
    - aarch64
    - x86_64

plugins:
  - origin: local
    path: plugins/sources
    sources:
      - dvc
      - git_lfs

  - origin: pip
    package-name: buildstream-plugins
    elements:
      - autotools
      - cmake
      - meson
      - pip
    sources:
      - git
      - patch
      - pip

  - origin: pip
    package-name: buildstream-plugins-community
    elements:
      - flatpak_image
      - flatpak_repo
    sources:
      - git_module
      - git_repo
      - git_tag
      - zip

