# Unique project name
name: rocm-flatpak-singles

# Required BuildStream version
min-version: 2.1

# Subdirectory where elements are stored
element-path: elements

shell:
  host-files:
  - host_path: '/etc/terminfo'
    path: '/etc/terminfo'
    optional: True

elements:
  pip:
    variables:
      pip-flags: |
        %{pip} install --no-deps --no-build-isolation --root=%{install-root} --prefix=%{prefix}

  cmake:
    variables:
      cmake-global: |
        -DCMAKE_BUILD_TYPE=Release
      # Every ROCm cmake element gets the shared install prefix, TheRock's
      # in-tree find modules, and (when selected by a toolchain fragment) the
      # amd-llvm/amd-hip compiler toolchain arguments.
      cmake-args: >-
        -DCMAKE_VERBOSE_MAKEFILE=ON
        -DCMAKE_INSTALL_PREFIX:PATH="%{prefix}"
        -DCMAKE_INSTALL_LIBDIR:PATH="%{lib}"
        -DROCM_SOURCE_ROOT=%{build-root}
        %{rocm-toolchain-cmake-args}
        %{cmake-global} %{cmake-local}

variables:
  lib: "lib"
  branch: "26.08"

  # Unified ROCm install prefix inside the Flatpak runtime extension. All
  # component elements install here so that build dependencies are co-located
  # and the final image can just collect this tree.
  rocm-sdk-prefix: "/usr/lib/%{gcc_triplet}/dri/amd/ROCm"
  rocm-sdk-llvm-prefix: "%{rocm-sdk-prefix}/lib/llvm"
  rocm-prefix: "%{rocm-sdk-prefix}"
  # TheRock places the LLVM install tree in lib/llvm; amd-llvm's element prefix
  # matches that and the toolchain fragments point the compiler at it.
  rocm-llvm-prefix: "%{rocm-sdk-llvm-prefix}"
  rocm-hip-prefix: "%{rocm-prefix}"
  # Runtime extension prefix (mounted through org.freedesktop.Platform.GL).
  rocm-runtime-prefix: "/usr/lib/%{gcc_triplet}/GL/ROCm"
  rocm-runtime-llvm-prefix: "%{rocm-runtime-prefix}/lib/llvm"
  rocm-gl-prefix: "/usr/lib/%{gcc_triplet}/GL/ROCm"
  # GPU targets passed to CMake as AMDGPU_TARGETS/GPU_TARGETS/CMAKE_HIP_ARCHITECTURES.
  # Override on the command line with -o rocm-gpu-targets ...
  rocm-gpu-targets: "gfx1100"
  # Default for elements that do not use a built compiler toolchain.
  rocm-toolchain-cmake-args: ""
  rocmtag: "therock-7.14.1"
  esmitag: "esmi_pkg_ver-5.2.1.1"

  # Third-party source versions, used by the per-component source declarations.
  simde-version: "0.8.2"
  yaml-cpp-version: "0.8.0"
  fmt-version: "11.1.3"
  googletest-version: "1.17.0"
  msgpack-cxx-version: "7.0.0"
  catch2-version: "3.8.1"
  spdlog-version: "1.15.3"
  libdivide-version: "5.2.0"
  robin-map-version: "1.4.1"
  eigen-version: "3.4.0"
  flatbuffers-version: "25.9.23"
  functionalplus-version: "0.2.25"
  nanobind-version: "2.12.0"
  frugally-deep-version: "0.15.31"
  fftw-version: "3.3.10"
  suitesparse-version: "7.8.3"
  grpc-version: "1.78.1"
  hwloc-version: "1.11.13"
  libbacktrace-rev: "b9e40069c0b47a722286b94eb5231f7f05c08713"
  ncurses-version: "6.6"
  otf2-version: "3.0.3"

  # Git tags still used by the shared source bundle.
  spirv_headers_tag: "b8a32968473ce852a809b9de5f04f02a5a9dfa78"

#  RECC_SERVER_ADDRESS: "unix:/run/reapi.sock"
#  CC: "recc gcc"
#  CXX: "recc g++"

environment:
  CFLAGS:  ""
  CXXFLAGS: ""
  LDFLAGS:  ""
  RUSTFLAGS:  ""
  CGO_CFLAGS: ""
  CGO_CXXFLAGS: ""
  CGO_LDFLAGS: ""
  # Make ROCm and the GL extension prefixes discoverable by CMake and
  # pkg-config for elements that do not use one of the toolchain files.
  CMAKE_PREFIX_PATH: "%{rocm-prefix}:%{rocm-llvm-prefix}:%{rocm-prefix}/lib/rocm_sysdeps:%{rocm-gl-prefix}:/usr"
  PKG_CONFIG_PATH: "%{rocm-prefix}/lib/rocm_sysdeps/lib/pkgconfig:%{rocm-gl-prefix}/lib/pkgconfig:/usr/lib/%{gcc_triplet}/GL/default/lib/pkgconfig"

aliases:
  crates: https://static.crates.io/
  freedesktop: https://gitlab.freedesktop.org/
  github: https://github.com/
  gitlab: https://gitlab.com/
  pypi: https://files.pythonhosted.org/packages/
  rocm: https://github.com/ROCm/
  rocm-third-party-deps: https://rocm-third-party-deps.s3.us-east-2.amazonaws.com/

defaults:
  targets:
  - rocm-runtime-flatpak.bst
  - rocm-sdk-flatpak.bst

# Do we need this? We should perhaps get rid of this.
(@):
- freedesktop-sdk.bst:include/runtime.yml

